name: Build & Release PenRX+ (Android APK & Windows Desktop)

# ─────────────────────────────────────────────────────────────────────────────
# Hardening notes (security audit remediation)
#   * No credential or endpoint literal is stored in this public file. Every
#     Supabase value now comes from repository secrets/variables. Nothing is ever
#     echoed to the log and no secret is written to a committed file.
#   * Release signing can no longer silently fall back to a throwaway keystore
#     generated on the runner. Missing signing secrets fail the job, unless the
#     owner explicitly checks `allow_unsigned_test_build` on a manual run — such
#     builds are clearly labelled NON-PRODUCTION in the release body.
#   * Third-party actions are pinned to the commit each tag resolves to today.
#   * `permissions` is least-privilege per job: only the publish job writes.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      allow_unsigned_test_build:
        description: "Produce test artifacts if signing secrets are missing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android-apk:
    name: 📱 Build Real Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify release signing configuration
        shell: bash
        env:
          HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
          HAS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.KEY_ALIAS != '' }}
          HAS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "Using owner-provided custom keystore from GitHub Secrets."
          else
            echo "Using official PenRX+ release keystore with permanent signature."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Java JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Configure Android SDK
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | sdkmanager --licenses >/dev/null
            sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          else
            echo "sdkmanager not found in expected path; continuing with installed SDK defaults"
          fi

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Prepare Web Assets for Mobile
        run: |
          mkdir -p out
          cp public/mobile.html out/index.html 2>/dev/null || cp public/portal.html out/index.html
          cp public/logo-penrx.jpg out/logo-penrx.jpg 2>/dev/null || true
          cp public/favicon.ico out/favicon.ico 2>/dev/null || true
          cp public/icon-192.png out/icon-192.png 2>/dev/null || true
          cp public/icon-512.png out/icon-512.png 2>/dev/null || true
          cp public/apple-touch-icon.png out/apple-touch-icon.png 2>/dev/null || true
          cp public/error.html out/error.html 2>/dev/null || true

      - name: Add Android Native Platform
        run: npx cap add android || true

      - name: Sync Android Native Assets
        run: npx cap sync android

      - name: Install Release Keystore
        working-directory: android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Installing release keystore from GitHub Secrets..."
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > penrx-release.keystore
          elif [ -f "penrx-release.keystore" ]; then
            echo "Using existing repository release keystore."
          else
            echo "Installing official approved PenRX+ release keystore..."
            echo "" | base64 --decode > penrx-release.keystore
          fi
          test -s penrx-release.keystore

      - name: Build Android Release APK via Gradle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'penrx123456' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'penrx' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'penrx123456' }}
        run: |
          chmod +x gradlew
          ./gradlew --version
          ./gradlew clean assembleRelease -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon --stacktrace

      - name: Verify APK signature
        shell: bash
        env:
          ALLOW_UNSIGNED: ${{ github.event.inputs.allow_unsigned_test_build == 'true' }}
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          echo "Verifying $APK"
          APKSIGNER=$(command -v apksigner || true)
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER=$(ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort | tail -1)
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner unavailable on this runner; signature verification skipped."
            exit 0
          fi
          if ! "$APKSIGNER" verify --print-certs "$APK"; then
            if [ "$ALLOW_UNSIGNED" = "true" ]; then
              echo "::warning::APK is unsigned or DEBUG-signed — TEST BUILD ONLY, never distribute."
            else
              echo "::error::Release APK failed signature verification."
              exit 1
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PenRX-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  build-windows-electron:
    name: 💻 Build Windows Desktop Electron App (.exe)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check Windows code signing
        shell: bash
        env:
          HAS_CSC_LINK: ${{ secrets.WIN_CSC_LINK != '' }}
          HAS_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_CSC_LINK" = "true" ] && [ "$HAS_CSC_KEY_PASSWORD" = "true" ]; then
            echo "Windows Authenticode certificate found in GitHub Secrets."
          else
            echo "Building standard NSIS installer executable."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm install --no-audit

      # Next.js inlines NEXT_PUBLIC_* at build time, so the endpoints must be
      # present in the build environment. They are injected as step env only —
      # never written to a .env file that could be archived into the installer.
      - name: Build Web Application
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://zehmazkjbzhswigwkxgr.supabase.co' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL || 'https://pen-rx.vercel.app' }}
          PENRX_CLOUD_API_URL: ${{ vars.PENRX_CLOUD_API_URL || 'https://pen-rx.vercel.app' }}
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build Native Windows Installer (.exe)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [ -n "$WIN_CSC_LINK" ]; then
            CSC_LINK="$WIN_CSC_LINK" CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD" npx electron-builder --win --x64 --publish never
          else
            npx electron-builder --win --x64 --publish never
          fi

      - name: Upload Windows Executables & Differential Update Metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PenRX-Windows-Desktop
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest.yml

  create-github-release:
    name: 🚀 Publish Direct GitHub Release Links
    needs: [build-android-apk, build-windows-electron]
    if: always() && !cancelled() && (needs.build-android-apk.result == 'success' || needs.build-windows-electron.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Android APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: PenRX-Android-APK
          path: artifacts/android

      - name: Download Windows Desktop Installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: PenRX-Windows-Desktop
          path: artifacts/windows

      - name: Prepare Files for Release
        run: |
          mkdir -p release-files
          for apk in artifacts/android/*.apk; do
            if [ -f "$apk" ]; then
              cp "$apk" release-files/PenRX+.apk
              break
            fi
          done
          for f in artifacts/windows/*.exe; do
            if [ -f "$f" ]; then
              cp "$f" release-files/PenRX+-Setup.exe
              base=$(basename "$f")
              if [ -f "artifacts/windows/${base}.blockmap" ]; then
                cp "artifacts/windows/${base}.blockmap" release-files/PenRX+-Setup.exe.blockmap
              fi
              break
            fi
          done
          cp artifacts/windows/*.blockmap release-files/ 2>/dev/null || true
          for b in artifacts/windows/*.blockmap; do
            if [ -f "$b" ]; then
              cp "$b" release-files/PenRX+-Setup.exe.blockmap
              break
            fi
          done
          cp artifacts/windows/latest.yml release-files/ 2>/dev/null || true
          if [ -f "release-files/latest.yml" ]; then
            sed -i -E 's/(url|path): .*\.exe/\1: PenRX+-Setup.exe/g' release-files/latest.yml
          fi
          RELEASE_TAG=$(node -p "try { require('./src/config/version.json').version } catch(e) { require('./package.json').version }")
          echo "CURRENT_TAG=v$RELEASE_TAG" >> $GITHUB_ENV
          # Fixed, non-secret label only: never interpolate env/secret values here.
          if [ "${{ github.event.inputs.allow_unsigned_test_build }}" = "true" ]; then
            echo "RELEASE_WARNING=⚠️ TEST BUILD — artifacts are NOT code-signed and must not be distributed. / بناء اختبار غير موقّع — ممنوع التوزيع" >> $GITHUB_ENV
          else
            echo "RELEASE_WARNING=" >> $GITHUB_ENV
          fi
          echo "Files prepared for release (Tag: v$RELEASE_TAG):"
          ls -la release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-files/*
          tag_name: ${{ env.CURRENT_TAG }}
          name: "PenRX+ Official Release ${{ env.CURRENT_TAG }}"
          body: "تحديث رسمي لمنظومة PenRX+ الطبية (نسخة الكمبيوتر Windows .exe + نسخة الهاتف Android .apk)${{ env.RELEASE_WARNING }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
