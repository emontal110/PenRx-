name: Build & Release PenRX+ (Android APK & Windows Desktop)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: 📱 Build Real Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Prepare Web Assets for Mobile
        run: |
          mkdir -p out
          cp docs/index.html out/index.html
          cp docs/logo-penrx.jpg out/logo-penrx.jpg 2>/dev/null || true
          cp docs/favicon.ico out/favicon.ico 2>/dev/null || true

      - name: Add Android Native Platform
        run: npx cap add android || true

      - name: Sync Android Native Assets
        run: npx cap sync android

      - name: Build Android APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenRX-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-windows-electron:
    name: 💻 Build Windows Desktop Electron App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Setup Environment Variables
        shell: bash
        run: |
          printf "%s\n" \
            "DATABASE_URL=postgresql://postgres:3060630@db.qspaigplwyvpqbmszpgc.supabase.co:5432/postgres" \
            "NEXT_PUBLIC_SUPABASE_URL=https://qspaigplwyvpqbmszpgc.supabase.co" \
            "NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzcGFpZ3Bsd3l2cHFibXN6cGdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1OTA1NDMsImV4cCI6MjEwNTE2NjU0M30.um74vP21e9C7lXeInvY4AsUCWsjyzlwSogLXP7b_Fkc" \
            "NEXT_PUBLIC_APP_URL=http://localhost:3000" \
            "PENRX_SECRET_KEY=d1132b51b81d261f94fc6fa2edb1292b534a75bdc8ce10ec8d0e3c00efe843b4" \
            "NEXT_TELEMETRY_DISABLED=1" > .env

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Web Application
        run: npx next build
        env:
          DATABASE_URL: "postgresql://postgres:3060630@db.qspaigplwyvpqbmszpgc.supabase.co:5432/postgres"
          NEXT_PUBLIC_SUPABASE_URL: "https://qspaigplwyvpqbmszpgc.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzcGFpZ3Bsd3l2cHFibXN6cGdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1OTA1NDMsImV4cCI6MjEwNTE2NjU0M30.um74vP21e9C7lXeInvY4AsUCWsjyzlwSogLXP7b_Fkc"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build Native Windows Installer (.exe)
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: PenRX-Windows-Desktop
          path: dist-electron/*.exe

  create-github-release:
    name: 🚀 Publish Direct GitHub Release Links
    needs: [build-android-apk, build-windows-electron]
    if: always() && !cancelled() && (needs.build-android-apk.result == 'success' || needs.build-windows-electron.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: PenRX-Android-APK
          path: artifacts/android

      - name: Download Windows Desktop Installer
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: PenRX-Windows-Desktop
          path: artifacts/windows

      - name: Prepare Files for Release
        run: |
          mkdir -p release-files
          # Android APK
          if [ -f "artifacts/android/app-debug.apk" ]; then
            cp artifacts/android/app-debug.apk release-files/PenRX+.apk
          fi
          # Windows Desktop Installer
          for f in artifacts/windows/*.exe; do
            if [ -f "$f" ]; then
              cp "$f" release-files/PenRX+-Setup.exe
              cp "$f" release-files/
              break
            fi
          done
          echo "Files prepared for release:"
          ls -la release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.3.2' }}
          name: PenRX+ Official Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
