name: Build & Release PenRX+ (Android APK & Windows Desktop)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: 📱 Build Real Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Prepare Web Assets for Mobile
        run: |
          mkdir -p out
          cp public/mobile.html out/index.html 2>/dev/null || cp public/portal.html out/index.html
          cp public/logo-penrx.jpg out/logo-penrx.jpg 2>/dev/null || true
          cp public/favicon.ico out/favicon.ico 2>/dev/null || true
          cp public/icon-192.png out/icon-192.png 2>/dev/null || true
          cp public/icon-512.png out/icon-512.png 2>/dev/null || true
          cp public/apple-touch-icon.png out/apple-touch-icon.png 2>/dev/null || true
          cp public/error.html out/error.html 2>/dev/null || true

      - name: Add Android Native Platform
        run: npx cap add android || true

      - name: Sync Android Native Assets
        run: npx cap sync android

      - name: Setup Release Keystore
        working-directory: android/app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'penrx123456' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'penrx' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'penrx123456' }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > penrx-release.keystore
          elif [ ! -f penrx-release.keystore ]; then
            keytool -genkeypair -v -keystore penrx-release.keystore -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=PenRX, OU=Medical, O=PenRX, L=Cairo, ST=Cairo, C=EG"
          fi

      - name: Build Android Release APK via Gradle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'penrx123456' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'penrx' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'penrx123456' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenRX-Android-APK
          path: android/app/build/outputs/apk/release/*.apk

  build-windows-electron:
    name: 💻 Build Windows Desktop Electron App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Release Assets Already Uploaded by Local Builder
        id: check_existing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG=$(node -p "try { require('./src/config/version.json').version } catch(e) { require('./package.json').version }")
          if gh release view "v${RELEASE_TAG}" --json assets --jq '.assets[].name' 2>/dev/null | grep -q "PenRX+-Setup.exe"; then
            echo "already_uploaded=true" >> $GITHUB_OUTPUT
            echo "✓ Release v${RELEASE_TAG} already contains PenRX+-Setup.exe from local builder; skipping cloud rebuild to preserve exact blockmap parity."
          else
            echo "already_uploaded=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check_existing.outputs.already_uploaded != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        if: steps.check_existing.outputs.already_uploaded != 'true'
        run: npm install --no-audit

      - name: Setup Environment Variables
        if: steps.check_existing.outputs.already_uploaded != 'true'
        shell: bash
        run: |
          printf "%s\n" \
            "NEXT_PUBLIC_SUPABASE_URL=https://qspaigplwyvpqbmszpgc.supabase.co" \
            "NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzcGFpZ3Bsd3l2cHFibXN6cGdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1OTA1NDMsImV4cCI6MjEwNTE2NjU0M30.um74vP21e9C7lXeInvY4AsUCWsjyzlwSogLXP7b_Fkc" \
            "NEXT_PUBLIC_APP_URL=http://localhost:3000" \
            "PENRX_CLOUD_API_URL=https://pen-rx.vercel.app" \
            "NEXT_TELEMETRY_DISABLED=1" > .env

      - name: Build Web Application
        if: steps.check_existing.outputs.already_uploaded != 'true'
        run: npx next build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://qspaigplwyvpqbmszpgc.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzcGFpZ3Bsd3l2cHFibXN6cGdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1OTA1NDMsImV4cCI6MjEwNTE2NjU0M30.um74vP21e9C7lXeInvY4AsUCWsjyzlwSogLXP7b_Fkc"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          PENRX_CLOUD_API_URL: "https://pen-rx.vercel.app"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build Native Windows Installer (.exe)
        if: steps.check_existing.outputs.already_uploaded != 'true'
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executables & Differential Update Metadata
        if: steps.check_existing.outputs.already_uploaded != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PenRX-Windows-Desktop
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest.yml

  create-github-release:
    name: 🚀 Publish Direct GitHub Release Links
    needs: [build-android-apk, build-windows-electron]
    if: always() && !cancelled() && (needs.build-android-apk.result == 'success' || needs.build-windows-electron.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android APK
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: PenRX-Android-APK
          path: artifacts/android

      - name: Download Windows Desktop Installer
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: PenRX-Windows-Desktop
          path: artifacts/windows

      - name: Prepare Files for Release
        run: |
          mkdir -p release-files
          for apk in artifacts/android/*.apk; do
            if [ -f "$apk" ]; then
              cp "$apk" release-files/PenRX+.apk
              break
            fi
          done
          for f in artifacts/windows/*.exe; do
            if [ -f "$f" ]; then
              cp "$f" release-files/PenRX+-Setup.exe
              base=$(basename "$f")
              if [ -f "artifacts/windows/${base}.blockmap" ]; then
                cp "artifacts/windows/${base}.blockmap" release-files/PenRX+-Setup.exe.blockmap
              fi
              break
            fi
          done
          cp artifacts/windows/*.blockmap release-files/ 2>/dev/null || true
          for b in artifacts/windows/*.blockmap; do
            if [ -f "$b" ]; then
              cp "$b" release-files/PenRX+-Setup.exe.blockmap
              break
            fi
          done
          cp artifacts/windows/latest.yml release-files/ 2>/dev/null || true
          if [ -f "release-files/latest.yml" ]; then
            sed -i -E 's/(url|path): .*\.exe/\1: PenRX+-Setup.exe/g' release-files/latest.yml
          fi
          RELEASE_TAG=$(node -p "try { require('./src/config/version.json').version } catch(e) { require('./package.json').version }")
          echo "CURRENT_TAG=v$RELEASE_TAG" >> $GITHUB_ENV
          echo "Files prepared for release (Tag: v$RELEASE_TAG):"
          ls -la release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          tag_name: ${{ env.CURRENT_TAG }}
          name: "PenRX+ Official Release ${{ env.CURRENT_TAG }}"
          body: "تحديث رسمي لمنظومة PenRX+ الطبية (نسخة الكمبيوتر Windows .exe + نسخة الهاتف Android .apk)"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
