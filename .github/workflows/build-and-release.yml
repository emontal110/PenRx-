name: Build & Release PenRX+ (Android APK & Windows Desktop)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: 📱 Build Real Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Application Bundle
        run: npm run build

      - name: Add Android Native Platform
        run: npx cap add android || true

      - name: Sync Android Native Assets
        run: npx cap sync android

      - name: Build Android APK via Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PenRX-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-windows-electron:
    name: 💻 Build Windows Desktop Electron App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Build Native Windows Installer (.exe)
        run: npx electron-builder --win --x64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: PenRX-Windows-Desktop
          path: dist-electron/*.exe

  create-github-release:
    name: 🚀 Publish Direct GitHub Release Links
    needs: [build-android-apk, build-windows-electron]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: PenRX-Android-APK
          path: artifacts/android

      - name: Download Windows Desktop Installer
        uses: actions/download-artifact@v4
        with:
          name: PenRX-Windows-Desktop
          path: artifacts/windows

      - name: Prepare Files for Release
        run: |
          mkdir -p release-files
          cp artifacts/android/app-debug.apk release-files/PenRX+.apk
          cp artifacts/windows/*.exe release-files/ 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          name: PenRX+ Official Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
